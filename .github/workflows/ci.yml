name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.x

      # Build with exactly the SDK set up above (the image may carry a newer one); overwrites the repo's global.json.
      - name: Pin the .NET 10 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force

      # No packages.lock.json in the repo, so cache on the project files that list the packages.
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Some tests behave differently when elevated or without a console session; record what this runner is.
      - name: Describe the runner
        shell: pwsh
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = ([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "User: $($id.Name)  Elevated: $admin  Session: $([Diagnostics.Process]::GetCurrentProcess().SessionId)"
          "Logical CPUs: $([Environment]::ProcessorCount)"
          "Interactive: $([Environment]::UserInteractive)"
          dotnet --info | Select-Object -First 12

      - name: Restore
        run: dotnet restore ProGuard.sln

      - name: Build
        id: build
        run: dotnet build ProGuard.sln -c Release --no-restore

      - name: Test
        id: test
        run: >
          dotnet test ProGuard.sln -c Release --no-build
          --blame-hang --blame-hang-timeout 5m
          --results-directory TestResults
          --logger "trx;LogFileName=ProGuard.Tests.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: failure() && steps.test.outcome == 'failure' || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      # Renders every page and dialog of the UI against the stand-in engine, so reviewers can see UI changes.
      - name: Render UI preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/ProGuard.Preview/bin/Release/net10.0-windows/ProGuard.Preview.exe artifacts/preview --mode all

      - name: Upload UI preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-preview
          path: artifacts/preview/
          if-no-files-found: warn
          retention-days: 14

  # The MSI, built the way release.yml builds it (but unsigned, at version 0.0.<run number>), so every PR has an
  # installer to try. In parallel with the tests.
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Pin the .NET 10 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-installer-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'installer/*.wixproj') }}
          restore-keys: nuget-installer-${{ runner.os }}-

      - name: Build the MSI
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.0.${{ github.run_number }}

      # The signing hook is off for every real build. Check its pfx route still works, on a copy of one exe, with a
      # throw-away self-signed certificate (no timestamp server, so the step doesn't depend on the network).
      - name: Check the signing hook
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=ProGuard CI signing check" -CertStoreLocation Cert:\CurrentUser\My
          try {
            $password = [guid]::NewGuid().ToString()
            $pfx = Join-Path $env:RUNNER_TEMP "ci-check.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            $copy = Join-Path $env:RUNNER_TEMP "ProGuard.SessionAgent.exe"
            Copy-Item artifacts/installer/files/ProGuard.SessionAgent.exe $copy
            $env:PROGUARD_SIGNING = "pfx"
            $env:PROGUARD_SIGN_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
            $env:PROGUARD_SIGN_PFX_PASSWORD = $password
            $env:PROGUARD_SIGN_TIMESTAMP_URL = "none"
            ./installer/sign.ps1 -Path $copy
          } finally {
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)"
          }

      - name: Upload the MSI
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: artifacts/installer/*.msi
          if-no-files-found: error
          retention-days: 14
