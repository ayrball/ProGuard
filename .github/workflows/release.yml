name: Release

# Push a tag to release: v1.2.0, or v1.2.0-beta.1 for a pre-release. Builds the MSI and the portable zip at that
# version and attaches them to a GitHub Release with generated notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    # Needs the owner's approval, and only v* tags may deploy to it (both set on GitHub). Signing secrets can be kept
    # in this environment rather than the repository, so nothing else can read them.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Pin the .NET 10 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force

      - name: Read the version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' isn't v<major>.<minor>.<patch> with an optional -prerelease suffix."
          }
          "version=$($env:TAG.Substring(1))" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($env:TAG.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      # The exes are self-contained, so each release must bundle the newest .NET 10 servicing patch: build.ps1 fails if
      # the SDK set up above published an older runtime than Microsoft's release metadata lists as the latest.
      - name: Find the latest .NET 10 runtime
        id: runtime
        shell: pwsh
        run: |
          $metadata = Invoke-RestMethod https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json
          $latest = "$($metadata.'latest-runtime')"
          if ($latest -notmatch '^10\.0\.\d+$') { throw "releases.json gave latest-runtime '$latest'." }
          "Latest .NET 10 runtime: $latest (released $($metadata.'latest-release-date'))"
          "version=$latest" >> $env:GITHUB_OUTPUT

      # Publishing and packaging get no secrets. The restore is locked to the committed packages.lock.json files
      # (CI=true, see Directory.Build.props). Only the two signing steps below see the signing variables.
      - name: Publish and stage the exes (unsigned)
        shell: pwsh
        run: ./installer/build.ps1 -Step Stage -Version ${{ steps.version.outputs.version }} -MinRuntime ${{ steps.runtime.outputs.version }}

      # ----- SIGNING HOOK -----------------------------------------------------------------------------------------
      # Off until the repository variable PROGUARD_SIGNING is set to pfx, trusted-signing (Azure Artifact Signing,
      # formerly Trusted Signing; artifact-signing means the same) or signpath. Add the matching secrets (and, for
      # Artifact Signing, variables) first; installer/sign.ps1 lists what each needs.
      # The dlib that signtool loads next to the signing secrets is pinned to one version of
      # Microsoft.ArtifactSigning.Client (which replaces the unlisted Microsoft.Trusted.Signing.Client) and checked
      # against a SHA-512 of that .nupkg before anything uses it. TS_SHA512 is the base64 SHA-512 of the .nupkg file
      # itself, as downloaded from
      # https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/<version>/microsoft.artifactsigning.client.<version>.nupkg
      # (it equals the packageHash nuget.org lists for that version). To move to another version, download that
      # .nupkg, check it has bin/x64/Azure.CodeSigning.Dlib.dll, and set both values.
      - name: Fetch the Artifact Signing dlib
        if: ${{ vars.PROGUARD_SIGNING == 'trusted-signing' || vars.PROGUARD_SIGNING == 'artifact-signing' }}
        shell: pwsh
        env:
          TS_VERSION: '1.0.151'
          TS_SHA512: 'BvPApD/Bxbzj2uf8qBYJ0wPoZYvAySHfrsIMZ2JkMQXy7NdTbQ81Gs71A0n/tOYOIWk3xpKY3YVZ1VtH0jcZhQ=='
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          nuget install Microsoft.ArtifactSigning.Client -Version $env:TS_VERSION -ExcludeVersion -NonInteractive `
            -Source https://api.nuget.org/v3/index.json -OutputDirectory $out
          if ($LASTEXITCODE -ne 0) { throw "nuget install failed ($LASTEXITCODE)." }
          $package = Join-Path $out 'Microsoft.ArtifactSigning.Client\Microsoft.ArtifactSigning.Client.nupkg'
          if (-not (Test-Path $package)) { throw "nuget didn't keep $package, so its hash can't be checked." }
          $hash = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $package -Algorithm SHA512).Hash))
          if ($hash -ne $env:TS_SHA512) { throw "Microsoft.ArtifactSigning.Client $env:TS_VERSION has SHA-512 $hash, not the pinned $env:TS_SHA512. Not signing with it." }
          $dlib = Join-Path $out 'Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) { throw "Microsoft.ArtifactSigning.Client $env:TS_VERSION has no bin\x64\Azure.CodeSigning.Dlib.dll." }
          "PROGUARD_SIGN_TS_DLIB=$dlib" >> $env:GITHUB_ENV

      - name: Sign the exes
        if: ${{ vars.PROGUARD_SIGNING != '' && vars.PROGUARD_SIGNING != 'none' }}
        shell: pwsh
        # Keep this env block the same as the one in "Sign the MSI".
        env:
          PROGUARD_SIGNING: ${{ vars.PROGUARD_SIGNING }}
          PROGUARD_SIGN_TIMESTAMP_URL: ${{ vars.PROGUARD_SIGN_TIMESTAMP_URL }}
          # pfx
          PROGUARD_SIGN_PFX_BASE64: ${{ secrets.PROGUARD_SIGN_PFX_BASE64 }}
          PROGUARD_SIGN_PFX_PASSWORD: ${{ secrets.PROGUARD_SIGN_PFX_PASSWORD }}
          # trusted-signing / artifact-signing
          PROGUARD_SIGN_TS_ENDPOINT: ${{ vars.PROGUARD_SIGN_TS_ENDPOINT }}
          PROGUARD_SIGN_TS_ACCOUNT: ${{ vars.PROGUARD_SIGN_TS_ACCOUNT }}
          PROGUARD_SIGN_TS_PROFILE: ${{ vars.PROGUARD_SIGN_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # signpath
          PROGUARD_SIGN_SIGNPATH_TOKEN: ${{ secrets.PROGUARD_SIGN_SIGNPATH_TOKEN }}
          PROGUARD_SIGN_SIGNPATH_ORGANIZATION: ${{ vars.PROGUARD_SIGN_SIGNPATH_ORGANIZATION }}
          PROGUARD_SIGN_SIGNPATH_PROJECT: ${{ vars.PROGUARD_SIGN_SIGNPATH_PROJECT }}
          PROGUARD_SIGN_SIGNPATH_POLICY: ${{ vars.PROGUARD_SIGN_SIGNPATH_POLICY }}
          PROGUARD_SIGN_SIGNPATH_CONFIGURATION: ${{ vars.PROGUARD_SIGN_SIGNPATH_CONFIGURATION }}
        run: ./installer/sign.ps1 -Path (Get-ChildItem artifacts/installer/files -Filter 'ProGuard.*.exe').FullName

      - name: Build the MSI and the portable zip
        shell: pwsh
        run: ./installer/build.ps1 -Step Package -Version ${{ steps.version.outputs.version }} -Portable

      - name: Sign the MSI
        if: ${{ vars.PROGUARD_SIGNING != '' && vars.PROGUARD_SIGNING != 'none' }}
        shell: pwsh
        # Keep this env block the same as the one in "Sign the exes".
        env:
          PROGUARD_SIGNING: ${{ vars.PROGUARD_SIGNING }}
          PROGUARD_SIGN_TIMESTAMP_URL: ${{ vars.PROGUARD_SIGN_TIMESTAMP_URL }}
          # pfx
          PROGUARD_SIGN_PFX_BASE64: ${{ secrets.PROGUARD_SIGN_PFX_BASE64 }}
          PROGUARD_SIGN_PFX_PASSWORD: ${{ secrets.PROGUARD_SIGN_PFX_PASSWORD }}
          # trusted-signing / artifact-signing
          PROGUARD_SIGN_TS_ENDPOINT: ${{ vars.PROGUARD_SIGN_TS_ENDPOINT }}
          PROGUARD_SIGN_TS_ACCOUNT: ${{ vars.PROGUARD_SIGN_TS_ACCOUNT }}
          PROGUARD_SIGN_TS_PROFILE: ${{ vars.PROGUARD_SIGN_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # signpath
          PROGUARD_SIGN_SIGNPATH_TOKEN: ${{ secrets.PROGUARD_SIGN_SIGNPATH_TOKEN }}
          PROGUARD_SIGN_SIGNPATH_ORGANIZATION: ${{ vars.PROGUARD_SIGN_SIGNPATH_ORGANIZATION }}
          PROGUARD_SIGN_SIGNPATH_PROJECT: ${{ vars.PROGUARD_SIGN_SIGNPATH_PROJECT }}
          PROGUARD_SIGN_SIGNPATH_POLICY: ${{ vars.PROGUARD_SIGN_SIGNPATH_POLICY }}
          PROGUARD_SIGN_SIGNPATH_CONFIGURATION: ${{ vars.PROGUARD_SIGN_SIGNPATH_CONFIGURATION }}
        run: ./installer/sign.ps1 -Path (Get-Item artifacts/installer/*.msi).FullName

      - name: Checksums
        shell: pwsh
        working-directory: artifacts/installer
        run: |
          Get-ChildItem *.msi, *.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Kept even if creating the release fails, so the build isn't lost.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.zip
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

      # A release drafted by hand for this tag (release notes written first, published afterwards) already exists when
      # publishing it creates the tag: then this build's files replace its attachments. Otherwise the release is created.
      - name: Create or update the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $files = @(Get-ChildItem artifacts/installer/*.msi, artifacts/installer/*.zip, artifacts/installer/SHA256SUMS.txt).FullName
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)." }
          } else {
            $flags = @("--title", "ProGuard $env:VERSION", "--generate-notes", "--verify-tag")
            if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }
            gh release create $env:TAG @files @flags
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)." }
          }
